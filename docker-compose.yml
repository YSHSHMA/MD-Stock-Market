services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-market-app-staging
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: stock_market
      DB_USERNAME: stock_market
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-marketboard-local-only}
      DB_SSLMODE: disable
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-marketboard-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-marketboard-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-marketboard-local-secret}
      REVERB_HOST: websocket
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost,127.0.0.1}
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: stock-market-web-staging
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - app-network
    depends_on:
      - app
      - websocket

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-market-websocket-staging
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-marketboard-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-marketboard-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-marketboard-local-secret}
      REVERB_HOST: websocket
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost,127.0.0.1}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    networks:
      - app-network

  # Dedicated container for the scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-market-scheduler-staging
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: stock_market
      DB_USERNAME: stock_market
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-marketboard-local-only}
      DB_SSLMODE: disable
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-marketboard-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-marketboard-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-marketboard-local-secret}
      REVERB_HOST: websocket
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-localhost,127.0.0.1}
    command: ["php", "artisan", "schedule:work"]
    networks:
      - app-network
    depends_on:
      app:
        condition: service_started
      websocket:
        condition: service_started
      db:
        condition: service_healthy

  # Worker for the Telegram bot / jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-market-worker-staging
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: stock_market
      DB_USERNAME: stock_market
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-marketboard-local-only}
      DB_SSLMODE: disable
    command: ["php", "artisan", "queue:work", "--queue=email"]
    networks:
      - app-network
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: stock-market-db-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: stock_market
      POSTGRES_USER: stock_market
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-marketboard-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_market -d stock_market"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
