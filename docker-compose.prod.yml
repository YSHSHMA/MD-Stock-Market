services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-market-app-prod
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: stock-market-web-prod
    restart: always
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - app
      - websocket

  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-market-websocket-prod
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    environment:
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    networks:
      - app-network

  # Dedicated container for the scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-market-scheduler-prod
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    command: ["php", "artisan", "schedule:work"]
    networks:
      - app-network
    depends_on:
      - app
      - websocket

  # Worker for the Telegram bot / jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-market-worker-prod
    restart: always
    working_dir: /var/www
    env_file:
      - .env.production
    command: ["php", "artisan", "queue:work", "--queue=email,default"]
    networks:
      - app-network
    depends_on:
      - app

networks:
  app-network:
    driver: bridge
